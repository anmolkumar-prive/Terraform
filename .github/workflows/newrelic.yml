name: New Relic Terraform Workflow

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.tf'
  workflow_dispatch:

jobs:
  newrelic-plan:
    uses: anmolkumar-prive/Terraform/.github/workflows/reusable-terraform.yml

    with:
      provider: newrelic
      environment: SIT-SG              # ✅ hardcoded since push/PR has no inputs
      working_directory: .             # ✅ because main.tf is in root
      terraform_version: '1.9.4'
      tflint_version: 'v0.60.0'
      sops_version: '3.7.3'
      plan_approvers: 'team-devops'

    secrets:
      GITHUB_PAT_TOKEN: ${{ secrets.GITHUB_PAT_TOKEN }}
      PLAN_ENCRYPT: ${{ secrets.PLAN_ENCRYPT }}
      NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}